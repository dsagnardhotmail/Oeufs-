<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Œufs">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F2E8D5'/%3E%3Cellipse cx='50' cy='56' rx='26' ry='32' fill='%23F4A623'/%3E%3C/svg%3E">
<title>Mirabelle — Fraîcheur des œufs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F2E8D5;
    --shell:#FBF4E6;
    --yolk:#F4A623;
    --ink:#2B241C;
    --wood:#4A3526;
    --sage:#6F8B5E;
    --amber:#CE8A2E;
    --rust:#C1572A;
    --line: rgba(74,53,38,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    min-height:100vh;
    background: radial-gradient(circle at 30% 0%, #FBF4E6 0%, var(--cream) 55%, #ECE0C5 100%);
    font-family:'Outfit', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 18px;
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--shell);
    border-radius:28px;
    padding:34px 26px 30px;
    box-shadow:0 1px 0 #fff inset, 0 18px 40px -12px rgba(74,53,38,0.25);
    position:relative;
    overflow:hidden;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--wood);
    opacity:.55;
    text-align:center;
    margin-bottom:18px;
    font-weight:600;
  }

  /* --- L'oeuf signature : il "s'illumine" comme à la mirabelle (technique du mirage) --- */
  .egg-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:6px;
  }
  .egg-glow{
    width:108px;
    height:132px;
    position:relative;
    transition: filter 0.6s ease;
  }
  .egg-glow svg{ width:100%; height:100%; display:block; }
  .egg-shape{
    fill: var(--yolk);
    stroke: var(--wood);
    stroke-width: 2;
    transition: fill 0.6s ease;
  }
  .egg-glow.extra{ filter: drop-shadow(0 0 22px rgba(111,139,94,0.65)); }
  .egg-glow.extra .egg-shape{ fill:#EFC75E; }
  .egg-glow.fraiche{ filter: drop-shadow(0 0 16px rgba(206,138,46,0.55)); }
  .egg-glow.expired{ filter: drop-shadow(0 0 14px rgba(193,87,42,0.5)); }
  .egg-glow.expired .egg-shape{ fill:#D8B48A; }
  .egg-speckle{ fill: var(--wood); opacity:.18; }
  .egg-glow.idle{ filter:none; }

  @keyframes settle{
    0%{ transform: translateY(-6px) rotate(-3deg); opacity:0;}
    100%{ transform: translateY(0) rotate(0); opacity:1;}
  }
  .egg-glow{ animation: settle .5s ease-out; }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.5em;
    text-align:center;
    margin: 4px 0 2px;
    letter-spacing:-0.01em;
  }
  .tagline{
    text-align:center;
    font-size:.82em;
    color:var(--wood);
    opacity:.6;
    margin-bottom:24px;
  }

  label.field-label{
    display:block;
    font-size:.78em;
    font-weight:600;
    color:var(--wood);
    margin-bottom:7px;
    letter-spacing:.02em;
  }
  .date-row{ position:relative; margin-bottom:6px; }
  .date-display{
    width:100%;
    padding:13px 14px;
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:14px;
    font-family:'Outfit', sans-serif;
    font-size:1em;
    color:var(--ink);
    text-align:left;
    cursor:pointer;
  }
  .date-display.has-value{ color:var(--ink); font-weight:500; }
  .date-display:focus, .date-display.open{
    outline:none;
    border-color:var(--yolk);
    box-shadow:0 0 0 3px rgba(244,166,35,0.18);
  }

  .calendar-panel{
    display:none;
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    right:0;
    background:#fff;
    border-radius:16px;
    border:1.5px solid var(--line);
    box-shadow:0 12px 28px -8px rgba(74,53,38,0.28);
    padding:14px 12px 12px;
    z-index:20;
  }
  .calendar-panel.open{ display:block; animation: settle .22s ease-out; }
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .cal-month{
    font-weight:600;
    font-size:.9em;
    text-transform:capitalize;
  }
  .cal-nav{
    width:30px; height:30px;
    border-radius:50%;
    border:none;
    background:var(--cream);
    color:var(--wood);
    font-size:1.1em;
    cursor:pointer;
    line-height:1;
  }
  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:.68em;
    color:var(--wood);
    opacity:.5;
    font-weight:600;
    margin-bottom:4px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:2px;
  }
  .cal-day{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    background:transparent;
    border-radius:50%;
    font-size:.82em;
    font-family:'Outfit', sans-serif;
    color:var(--ink);
    cursor:pointer;
  }
  .cal-day:disabled{ opacity:.28; cursor:default; }
  .cal-day.other-month{ opacity:.32; }
  .cal-day.today{ font-weight:700; color:var(--wood); }
  .cal-day.selected{ background:var(--yolk); color:#fff; font-weight:700; }

  /* --- Jauge chronologique ponte -> DLC --- */
  .timeline{
    margin-top:26px;
    display:none;
  }
  .timeline.show{ display:block; }
  .timeline-track{
    position:relative;
    height:10px;
    border-radius:6px;
    background: linear-gradient(to right,
      var(--sage) 0%, var(--sage) calc(var(--cut,32%)),
      var(--amber) calc(var(--cut,32%)), var(--amber) 100%);
    overflow:visible;
  }
  .timeline-marker{
    position:absolute;
    top:50%;
    left: var(--pos, 0%);
    width:16px; height:16px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--wood);
    transform: translate(-50%,-50%);
    transition: left .5s ease;
  }
  .timeline-labels{
    display:flex;
    justify-content:space-between;
    font-size:.68em;
    color:var(--wood);
    opacity:.55;
    margin-top:8px;
    font-weight:500;
  }

  .result{
    margin-top:22px;
    border-radius:18px;
    padding:18px 18px 16px;
    text-align:center;
    display:none;
    border:1.5px solid var(--line);
  }
  .result.show{ display:block; animation: settle .35s ease-out; }
  .result-title{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-size:1.25em;
    margin-bottom:4px;
  }
  .result.extra{ background:rgba(111,139,94,0.12); border-color:rgba(111,139,94,0.35); }
  .result.extra .result-title{ color:#4F6B41; }
  .result.fraiche{ background:rgba(206,138,46,0.12); border-color:rgba(206,138,46,0.35); }
  .result.fraiche .result-title{ color:#9A641C; }
  .result.expired{ background:rgba(193,87,42,0.12); border-color:rgba(193,87,42,0.35); }
  .result.expired .result-title{ color:#9C4521; }
  .result-detail{
    font-size:.85em;
    color:var(--ink);
    opacity:.72;
    line-height:1.45;
  }

  .footnote{
    margin-top:18px;
    text-align:center;
    font-size:.68em;
    color:var(--wood);
    opacity:.42;
    line-height:1.4;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">La mirabelle de l'œuf</div>

    <div class="egg-wrap">
      <div class="egg-glow idle" id="eggGlow">
        <svg viewBox="0 0 108 132">
          <path class="egg-shape" d="M54 4 C30 4 6 48 6 84 C6 112 28 128 54 128 C80 128 102 112 102 84 C102 48 78 4 54 4 Z"/>
          <ellipse class="egg-speckle" cx="38" cy="60" rx="3" ry="2"/>
          <ellipse class="egg-speckle" cx="66" cy="78" rx="2.5" ry="2"/>
          <ellipse class="egg-speckle" cx="50" cy="95" rx="2" ry="1.6"/>
        </svg>
      </div>
    </div>

    <h1>Frais ou pas ?</h1>
    <div class="tagline">Entrez la DLC inscrite sur la boîte</div>

    <label class="field-label" for="dlc">Date limite de consommation</label>
    <div class="date-row">
      <button type="button" class="date-display" id="dateDisplay">Choisir une date</button>
      <div class="calendar-panel" id="calendarPanel">
        <div class="cal-header">
          <button type="button" class="cal-nav" id="prevMonth" aria-label="Mois précédent">‹</button>
          <span class="cal-month" id="calMonthLabel"></span>
          <button type="button" class="cal-nav" id="nextMonth" aria-label="Mois suivant">›</button>
        </div>
        <div class="cal-weekdays">
          <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>

    <div class="timeline" id="timeline">
      <div class="timeline-track" id="track">
        <div class="timeline-marker" id="marker"></div>
      </div>
      <div class="timeline-labels">
        <span>Ponte</span>
        <span>DLC (J+28)</span>
      </div>
    </div>

    <div class="result" id="result">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-detail" id="resultDetail"></div>
    </div>

    <div class="footnote">D'après la réglementation française : DLC = ponte + 28&nbsp;jours · extra frais jusqu'à J+9</div>
  </div>

<script>
  const dateDisplay = document.getElementById('dateDisplay');
  const calendarPanel = document.getElementById('calendarPanel');
  const calMonthLabel = document.getElementById('calMonthLabel');
  const calGrid = document.getElementById('calGrid');
  const prevMonth = document.getElementById('prevMonth');
  const nextMonth = document.getElementById('nextMonth');
  const result = document.getElementById('result');
  const resultTitle = document.getElementById('resultTitle');
  const resultDetail = document.getElementById('resultDetail');
  const timeline = document.getElementById('timeline');
  const track = document.getElementById('track');
  const marker = document.getElementById('marker');
  const eggGlow = document.getElementById('eggGlow');

  let selectedDate = null;
  let viewYear, viewMonth;
  const today0 = new Date(); today0.setHours(0,0,0,0);
  viewYear = today0.getFullYear();
  viewMonth = today0.getMonth();

  const moisNoms = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const fmt = d => d.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });

  dateDisplay.addEventListener('click', () => {
    const isOpen = calendarPanel.classList.toggle('open');
    dateDisplay.classList.toggle('open', isOpen);
    if (isOpen) renderCalendar();
  });

  document.addEventListener('click', (e) => {
    if (!calendarPanel.contains(e.target) && e.target !== dateDisplay && calendarPanel.classList.contains('open')) {
      calendarPanel.classList.remove('open');
      dateDisplay.classList.remove('open');
    }
  });

  prevMonth.addEventListener('click', () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  nextMonth.addEventListener('click', () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  function renderCalendar() {
    calMonthLabel.textContent = `${moisNoms[viewMonth]} ${viewYear}`;
    calGrid.innerHTML = '';

    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    let startOffset = firstOfMonth.getDay() - 1; // lundi = 0
    if (startOffset < 0) startOffset = 6;

    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

    const cells = [];
    for (let i = startOffset; i > 0; i--) {
      cells.push({ day: daysInPrevMonth - i + 1, month: viewMonth - 1, year: viewYear, other:true });
    }
    for (let d = 1; d <= daysInMonth; d++) {
      cells.push({ day: d, month: viewMonth, year: viewYear, other:false });
    }
    while (cells.length % 7 !== 0 || cells.length < 35) {
      const last = cells[cells.length-1];
      const nd = new Date(last.year, last.month, last.day + 1);
      cells.push({ day: nd.getDate(), month: nd.getMonth(), year: nd.getFullYear(), other:true });
    }

    cells.forEach(c => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cal-day' + (c.other ? ' other-month' : '');
      btn.textContent = c.day;
      const cellDate = new Date(c.year, c.month, c.day);
      cellDate.setHours(0,0,0,0);

      if (cellDate.getTime() === today0.getTime()) btn.classList.add('today');
      if (selectedDate && cellDate.getTime() === selectedDate.getTime()) btn.classList.add('selected');

      btn.addEventListener('click', () => {
        selectedDate = cellDate;
        dateDisplay.textContent = fmt(cellDate);
        dateDisplay.classList.add('has-value');
        calendarPanel.classList.remove('open');
        dateDisplay.classList.remove('open');
        calculer();
      });
      calGrid.appendChild(btn);
    });
  }

  function calculer() {
    if (!selectedDate) {
      result.classList.remove('show');
      timeline.classList.remove('show');
      eggGlow.className = 'egg-glow idle';
      return;
    }

    const dlc = selectedDate;
    const aujourdhui = today0;

    const seuilExtraFrais = new Date(dlc);
    seuilExtraFrais.setDate(seuilExtraFrais.getDate() - 19);

    const msParJour = 1000 * 60 * 60 * 24;
    const joursRestants = Math.round((dlc - aujourdhui) / msParJour);
    const joursDepuisPonte = 28 - joursRestants;

    result.classList.remove('extra','fraiche','expired');
    result.classList.add('show');
    timeline.classList.add('show');

    const cutPct = (9/28*100).toFixed(1) + '%';
    track.style.setProperty('--cut', cutPct);
    const posPct = Math.max(0, Math.min(100, (joursDepuisPonte/28*100))).toFixed(1) + '%';
    marker.style.setProperty('--pos', posPct);

    if (aujourdhui > dlc) {
      eggGlow.className = 'egg-glow expired';
      result.classList.add('expired');
      resultTitle.textContent = "Passé sa date";
      resultDetail.innerHTML = `La DLC est dépassée depuis ${Math.abs(joursRestants)} jour(s). Faites le test de flottaison dans l'eau avant de consommer.`;
    } else if (aujourdhui <= seuilExtraFrais) {
      eggGlow.className = 'egg-glow extra';
      result.classList.add('extra');
      resultTitle.textContent = "Extra frais";
      resultDetail.innerHTML = `Pondu il y a environ ${Math.max(joursDepuisPonte,0)} jour(s). Parfait à la coque ou mollet — encore ${Math.round((seuilExtraFrais - aujourdhui)/msParJour)} jour(s) avant de perdre ce statut.`;
    } else {
      eggGlow.className = 'egg-glow fraiche';
      result.classList.add('fraiche');
      resultTitle.textContent = "Frais";
      resultDetail.innerHTML = `Pondu il y a environ ${joursDepuisPonte} jour(s). Encore bon ${joursRestants} jour(s) — idéal à la cuisson plutôt qu'à la coque.`;
    }
  }
</script>
</body>
</html>
